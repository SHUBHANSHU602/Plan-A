name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-quality:
    name: ML quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install ML and test dependencies
        run: python -m pip install -e './ml[test]'

      - name: Lint
        run: ruff check ml

      - name: Verify formatting
        run: ruff format --check ml

      - name: Test
        run: pytest ml/tests

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[test]'

      - name: Lint
        run: ruff check backend

      - name: Verify formatting
        run: ruff format --check backend

      - name: Test
        run: pytest backend/tests -m "not integration"

  backend-database:
    name: PostGIS migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: plan_a_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plan_a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/plan_a_test
      RUN_DATABASE_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[test]'

      - name: Apply database migrations
        run: alembic -c backend/alembic.ini upgrade head

      - name: Check models and migration are synchronized
        run: alembic -c backend/alembic.ini check

      - name: Verify PostGIS schema
        run: pytest backend/tests/integration

  backend-container:
    name: Backend container
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-database]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build --tag plan-a-api:ci backend
