[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-a-api"
version = "0.1.0"
description = "Backend API for the Plan-A landslide early-warning platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "apscheduler>=3.11,<4.0",
    "fastapi>=0.115,<1.0",
    "firebase-admin>=7.0,<8.0",
    "geoalchemy2>=0.16,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "scikit-learn==1.8.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "integration: requires a running PostgreSQL/PostGIS database",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
