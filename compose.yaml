services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://plan_a:plan_a_local@db:5432/plan_a}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_MAX_ATTEMPTS: ${FCM_MAX_ATTEMPTS:-5}
      FCM_RETRY_BASE_SECONDS: ${FCM_RETRY_BASE_SECONDS:-30}
      FCM_REQUEST_TIMEOUT_SECONDS: ${FCM_REQUEST_TIMEOUT_SECONDS:-15}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plan_a}
      POSTGRES_USER: ${POSTGRES_USER:-plan_a}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plan_a_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
